name: G01 Shared Host Package

on:
  push:
    branches: ['g01/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify frontend before packaging
        run: npm run check
      - name: Package shared-host release
        run: bash scripts/package-shared-host.sh
      - name: Upload immutable deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: g01-shared-host-${{ github.sha }}
          path: deploy-package/*.tar.gz
          if-no-files-found: error
          retention-days: 14
