name: G01 Configure staging Telegram menu button

on:
  workflow_dispatch:
  push:
    branches: ['g01/android-menu-bidi']
    paths:
      - '.github/workflows/g01-staging-menu-button.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Apply and verify Persian bidi-safe menu button
        env:
          BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
          STAGING_ORIGIN: ${{ secrets.STAGING_ORIGIN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get('BOT_TOKEN', '')
          origin = os.environ.get('STAGING_ORIGIN', '')
          if not token or not origin:
              raise SystemExit('Required staging secrets are unavailable')

          # Telegram Android composes this native control in an LTR chat UI when
          # the client language is English. LRM boundaries keep the Persian label
          # a single bidi unit without changing its visible wording.
          menu_text = '\u200eساخت فاکتور\u200e'

          def call(method: str, payload: dict | None = None):
              url = f'https://api.telegram.org/bot{token}/{method}'
              body = json.dumps(payload or {}, ensure_ascii=False).encode('utf-8')
              request = urllib.request.Request(
                  url,
                  data=body,
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      data = json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f'Telegram Bot API HTTP failure: {exc.code}') from None
              if data.get('ok') is not True:
                  raise SystemExit(f'Telegram Bot API rejected {method}: error_code={data.get("error_code")}')
              return data.get('result')

          changed = call('setChatMenuButton', {
              'menu_button': {
                  'type': 'web_app',
                  'text': menu_text,
                  'web_app': {'url': origin},
              }
          })
          if changed is not True:
              raise SystemExit('setChatMenuButton did not return true')

          current = call('getChatMenuButton')
          expected = {
              'type': 'web_app',
              'text': menu_text,
              'web_app': {'url': origin},
          }
          if current != expected:
              raise SystemExit('Telegram menu button verification mismatch')

          print('Staging Telegram menu button bidi configuration: PASS')
          PY
