name: Quality CI

on:
  push:
    branches: [main, 'g01/**', 'g02/**', 'g03/**', 'g04/**', 'g05/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck, tests, build and bundle secret scan
        run: npm run check
      - name: Install visual-test browser
        run: npx playwright install --with-deps chromium
      - name: RTL viewport visual regression
        run: npm run test:visual
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3

  authenticated-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: telegram_invoice_e2e
          MYSQL_USER: tinv
          MYSQL_PASSWORD: tinv_e2e_password
          MYSQL_ROOT_PASSWORD: root_e2e_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_e2e_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      APP_ORIGIN: https://app.example.test
      TELEGRAM_BOT_TOKEN: e2e-test-token-not-a-real-secret
      SESSION_PEPPER: e2e-test-session-pepper-0123456789abcdef
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: telegram_invoice_e2e
      DB_USER: tinv
      DB_PASSWORD: tinv_e2e_password
      AUTH_MAX_AGE_SECONDS: 300
      AUTH_FUTURE_SKEW_SECONDS: 30
      SESSION_IDLE_TTL_SECONDS: 604800
      SESSION_ABSOLUTE_TTL_SECONDS: 2592000
      SESSION_TOUCH_INTERVAL_SECONDS: 300
      TINV_E2E_AUTH: '1'
      TINV_E2E_BOT_TOKEN: e2e-test-token-not-a-real-secret
      TINV_E2E_APP_ORIGIN: https://app.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, fileinfo
      - name: Install pinned frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply migrations to disposable E2E database
        run: php server/bin/migrate.php
      - name: Start disposable PHP API
        run: |
          php -S 127.0.0.1:8080 -t server/public server/public/index.php >/tmp/mira-e2e-php.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mira-e2e-php.log >&2
          exit 1
      - name: Install authenticated E2E browser
        run: npx playwright install --with-deps chromium
      - name: Synthetic Telegram A/B tenant-isolation E2E
        run: npx playwright test tests/e2e/g09-auth-tenant.e2e.spec.ts --project=Desktop-Chrome
      - name: Print redacted PHP diagnostics on failure
        if: failure()
        run: grep -E '^(\[|[A-Za-z].* (GET|POST|PUT|DELETE) /api/)' /tmp/mira-e2e-php.log | tail -n 80 || true
      - name: Upload authenticated E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-e2e-failure-${{ github.sha }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 3

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: telegram_invoice_test
          MYSQL_USER: tinv
          MYSQL_PASSWORD: tinv_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      APP_ORIGIN: https://app.example.test
      TELEGRAM_BOT_TOKEN: unit-test-token-not-a-real-secret
      SESSION_PEPPER: unit-test-session-pepper-0123456789abcdef
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: telegram_invoice_test
      DB_USER: tinv
      DB_PASSWORD: tinv_test_password
      AUTH_MAX_AGE_SECONDS: 300
      AUTH_FUTURE_SKEW_SECONDS: 30
      SESSION_IDLE_TTL_SECONDS: 604800
      SESSION_ABSOLUTE_TTL_SECONDS: 2592000
      SESSION_TOUCH_INTERVAL_SECONDS: 300
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, fileinfo
      - name: PHP syntax check
        run: find server tests/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit security tests
        run: php tests/php/run-unit.php
      - name: Apply versioned migrations
        run: php server/bin/migrate.php
      - name: DB-backed auth/session integration tests
        run: php tests/php/run-integration.php
      - name: G03 settings persistence and security tests
        run: php tests/php/run-settings.php
      - name: G04 deterministic sales-document tests
        run: php tests/php/run-sales.php
      - name: G09 privacy-safe pilot analytics and feedback tests
        run: php tests/php/run-pilot.php
      - name: Install database backup client
        run: command -v mysqldump >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq default-mysql-client; }
      - name: G08 database backup and restore rehearsal
        env:
          DB_ADMIN_USER: root
          DB_ADMIN_PASSWORD: root_test_password
        run: bash scripts/rehearse-db-backup-restore.sh

  deployment-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: bash -n scripts/prepare-shared-host-release.sh scripts/deploy-ftps.sh scripts/package-shared-host.sh scripts/rehearse-db-backup-restore.sh
      - name: FTPS certificate verification may not be disabled
        run: |
          if grep -E 'ssl:verify-certificate[[:space:]]+(no|false|0)' scripts/deploy-ftps.sh; then
            echo 'Unsafe FTPS certificate-verification override detected' >&2
            exit 1
          fi
          grep -F 'set ssl:verify-certificate yes' scripts/deploy-ftps.sh >/dev/null
      - name: FTPS credentials must use environment password transport
        run: |
          grep -F 'export LFTP_PASSWORD="$STAGING_FTPS_PASSWORD"' scripts/deploy-ftps.sh >/dev/null
          grep -F -- '--env-password' scripts/deploy-ftps.sh >/dev/null
          grep -F -- '--user' scripts/deploy-ftps.sh >/dev/null
          if grep -F 'open -u ' scripts/deploy-ftps.sh; then
            echo 'Do not combine cPanel username/password in lftp -u transport' >&2
            exit 1
          fi
      - name: cPanel webroot publication must use explicit PUT
        run: |
          grep -F 'publish_public_files()' scripts/deploy-ftps.sh >/dev/null
          grep -F 'commands+="mkdir -pf' scripts/deploy-ftps.sh >/dev/null
          grep -F 'if ! publish_public_files; then' scripts/deploy-ftps.sh >/dev/null
          grep -F 'Direct webroot publication failed; rolling back.' scripts/deploy-ftps.sh >/dev/null
      - name: Ephemeral migration bridge safety contract
        run: |
          grep -F "REQUEST_METHOD'] ?? '') !== 'POST'" scripts/deploy-ftps.sh >/dev/null
          grep -F "HTTP_X_TINV_DEPLOY_TOKEN" scripts/deploy-ftps.sh >/dev/null
          grep -F "hash_equals" scripts/deploy-ftps.sh >/dev/null
          grep -F "@unlink(__FILE__)" scripts/deploy-ftps.sh >/dev/null
          grep -F "Cache-Control: no-store" scripts/deploy-ftps.sh >/dev/null
          if find server/public -maxdepth 1 -type f -name '*migrat*.php' | grep -q .; then
            echo 'Persistent public migration endpoint detected' >&2
            exit 1
          fi
      - name: Migration diagnostics must remain redacted
        run: |
          grep -F "migration_error=pdo sqlstate=" scripts/deploy-ftps.sh >/dev/null
          grep -F "migration_error=runtime_config" scripts/deploy-ftps.sh >/dev/null
          grep -F "migration_error=php_runtime" scripts/deploy-ftps.sh >/dev/null
          grep -F "grep -Eq '^migration_error=(pdo|runtime_config|php_runtime)( |$)'" scripts/deploy-ftps.sh >/dev/null
          if grep -F 'getMessage()' scripts/deploy-ftps.sh; then
            echo 'Raw exception-message diagnostics are forbidden in deployment logs' >&2
            exit 1
          fi
      - name: Shared-host env loader must not require putenv
        run: |
          if grep -nE '^[[:space:]]*putenv[[:space:]]*\(' server/src/Support/Env.php; then
            echo 'Shared-host runtime must not depend on putenv()' >&2
            exit 1
          fi
          grep -F '$_ENV[$key] = $value;' server/src/Support/Env.php >/dev/null
      - name: Flat shared-host runtime must remain HTTP-denied
        run: |
          grep -F 'public_dir="$release_dir/server/public"' scripts/prepare-shared-host-release.sh >/dev/null
          grep -F 'tinv-runtime-src-$flat.php' scripts/prepare-shared-host-release.sh >/dev/null
          grep -F 'tinv-runtime-migration-$(basename "$migration_file")' scripts/prepare-shared-host-release.sh >/dev/null
          grep -F "tinv-runtime-bootstrap.php" server/public/index.php >/dev/null
          grep -F "tinv-runtime-runner.php" scripts/deploy-ftps.sh >/dev/null
          grep -F 'RewriteRule ^tinv-runtime(?:$|/|\.|-) - [F,L]' server/public/.htaccess >/dev/null
          if grep -F '/tinv-runtime/bootstrap.php' server/public/index.php scripts/deploy-ftps.sh; then
            echo 'Nested runtime path must not return to shared-host deployment' >&2
            exit 1
          fi
      - name: Staging origin must remain noindex
        run: |
          grep -F 'invoice-staging\.box4u\.co' server/public/.htaccess >/dev/null
          grep -F 'X-Robots-Tag "noindex, nofollow, noarchive"' server/public/.htaccess >/dev/null
      - name: Telegram bootstrap must remain locally bundled
        run: |
          if grep -R -E '<script[^>]+(telegram\.org|cdn\.jsdelivr\.net|unpkg\.com)' index.html src; then
            echo 'Telegram startup must not depend on an external runtime script' >&2
            exit 1
          fi
          grep -F '"@tma.js/sdk": "3.3.0"' package.json >/dev/null
          grep -F "script-src 'self'" index.html server/public/.htaccess >/dev/null
      - name: G03 settings authorization and raster upload guards stay present
        run: |
          grep -F '$context = $sessionContext();' server/public/index.php >/dev/null
          grep -F 'SettingsSchema::mergeForDocument' server/src/Settings/DocumentSettingsSnapshot.php >/dev/null
          grep -F "['image/png', 'image/jpeg', 'image/webp']" server/src/Settings/LogoService.php >/dev/null
          grep -F 'FILEINFO_MIME_TYPE' server/src/Settings/LogoService.php >/dev/null
          grep -F 'MAX_BYTES' server/src/Settings/LogoService.php >/dev/null
      - name: G04 tenant scope, integer money and conversion guards stay present
        run: |
          grep -F "business_id=?" server/src/Sales/SalesDocumentService.php >/dev/null
          grep -F "overpayment_rejected" server/src/Sales/SalesDocumentService.php >/dev/null
          grep -F "source_document_id" server/migrations/003_g04_sales_documents.sql >/dev/null
          if grep -R -E '\b(float|double)\b' server/src/Sales; then
            echo 'Floating point money is forbidden in G04' >&2
            exit 1
          fi
      - name: G08 rate limiting, correlation and recovery controls stay present
        run: |
          grep -F "class RateLimiter" server/src/Http/RateLimiter.php >/dev/null
          grep -F "X-Request-Id" server/public/index.php >/dev/null
          grep -F "Retry-After" server/public/index.php >/dev/null
          grep -F "rehearse-db-backup-restore.sh" .github/workflows/g01-ci.yml >/dev/null
          if grep -nE 'error_log\(.*getMessage\(\)' server/public/index.php; then
            echo 'Raw runtime exception messages must not enter application logs' >&2
            exit 1
          fi
      - name: G09 telemetry privacy boundary stays allowlisted
        run: |
          grep -F "class PilotService" server/src/Pilot/PilotService.php >/dev/null
          grep -F "EVENT_PROPERTIES" server/src/Pilot/PilotService.php >/dev/null
          grep -F "feedbackStatus" server/src/Pilot/PilotService.php >/dev/null
          grep -F "source_document_id" server/src/Pilot/PilotService.php >/dev/null
          if grep -nE "properties.*(customer|phone|item|note|card|account|payment)" server/src/Pilot/PilotService.php; then
            echo 'Sensitive invoice fields are forbidden in analytics properties' >&2
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository secret scan
        run: bash scripts/check-no-secrets.sh