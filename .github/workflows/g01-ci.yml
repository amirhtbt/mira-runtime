name: G01 CI

on:
  push:
    branches: [main, 'g01/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install pinned frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck, tests, build and bundle secret scan
        run: npm run check

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: telegram_invoice_test
          MYSQL_USER: tinv
          MYSQL_PASSWORD: tinv_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      APP_ORIGIN: https://app.example.test
      TELEGRAM_BOT_TOKEN: unit-test-token-not-a-real-secret
      SESSION_PEPPER: unit-test-session-pepper-0123456789abcdef
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: telegram_invoice_test
      DB_USER: tinv
      DB_PASSWORD: tinv_test_password
      AUTH_MAX_AGE_SECONDS: 300
      AUTH_FUTURE_SKEW_SECONDS: 30
      SESSION_IDLE_TTL_SECONDS: 604800
      SESSION_ABSOLUTE_TTL_SECONDS: 2592000
      SESSION_TOUCH_INTERVAL_SECONDS: 300
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql
      - name: PHP syntax check
        run: find server tests/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit security tests
        run: php tests/php/run-unit.php
      - name: Apply G01 migrations
        run: php server/bin/migrate.php
      - name: DB-backed auth/session integration tests
        run: php tests/php/run-integration.php

  deployment-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: bash -n scripts/prepare-shared-host-release.sh scripts/deploy-ftps.sh scripts/package-shared-host.sh
      - name: FTPS certificate verification may not be disabled
        run: |
          if grep -E 'ssl:verify-certificate[[:space:]]+(no|false|0)' scripts/deploy-ftps.sh; then
            echo 'Unsafe FTPS certificate-verification override detected' >&2
            exit 1
          fi
          grep -F 'set ssl:verify-certificate yes' scripts/deploy-ftps.sh >/dev/null
      - name: FTPS credentials must use environment password transport
        run: |
          grep -F 'export LFTP_PASSWORD="$STAGING_FTPS_PASSWORD"' scripts/deploy-ftps.sh >/dev/null
          grep -F -- '--env-password' scripts/deploy-ftps.sh >/dev/null
          grep -F -- '--user' scripts/deploy-ftps.sh >/dev/null
          if grep -F 'open -u ' scripts/deploy-ftps.sh; then
            echo 'Do not combine cPanel username/password in lftp -u transport' >&2
            exit 1
          fi
      - name: Ephemeral migration bridge safety contract
        run: |
          grep -F "REQUEST_METHOD'] ?? '') !== 'POST'" scripts/deploy-ftps.sh >/dev/null
          grep -F "HTTP_X_TINV_DEPLOY_TOKEN" scripts/deploy-ftps.sh >/dev/null
          grep -F "hash_equals" scripts/deploy-ftps.sh >/dev/null
          grep -F "@unlink(__FILE__)" scripts/deploy-ftps.sh >/dev/null
          grep -F "Cache-Control: no-store" scripts/deploy-ftps.sh >/dev/null
          if find server/public -maxdepth 1 -type f -name '*migrat*.php' | grep -q .; then
            echo 'Persistent public migration endpoint detected' >&2
            exit 1
          fi
      - name: Migration diagnostics must remain redacted
        run: |
          grep -F "migration_error=pdo sqlstate=" scripts/deploy-ftps.sh >/dev/null
          grep -F "migration_error=runtime_config" scripts/deploy-ftps.sh >/dev/null
          grep -F "migration_error=php_runtime" scripts/deploy-ftps.sh >/dev/null
          grep -F "grep -Eq '^migration_error=(pdo|runtime_config|php_runtime)( |$)'" scripts/deploy-ftps.sh >/dev/null
          if grep -F 'getMessage()' scripts/deploy-ftps.sh; then
            echo 'Raw exception-message diagnostics are forbidden in deployment logs' >&2
            exit 1
          fi
      - name: Shared-host env loader must not require putenv
        run: |
          if grep -nE '^[[:space:]]*putenv[[:space:]]*\(' server/src/Support/Env.php; then
            echo 'Shared-host runtime must not depend on putenv()' >&2
            exit 1
          fi
          grep -F '$_ENV[$key] = $value;' server/src/Support/Env.php >/dev/null
      - name: Contained runtime must remain HTTP-denied
        run: |
          grep -F 'runtime_dir="$release_dir/server/public/tinv-runtime"' scripts/prepare-shared-host-release.sh >/dev/null
          grep -F 'runtime_remote="server/public/tinv-runtime"' scripts/deploy-ftps.sh >/dev/null
          grep -F 'RewriteRule ^tinv-runtime(?:/|$) - [F,L]' server/public/.htaccess >/dev/null
          grep -F 'RewriteRule ^tinv-runtime\.env$ - [F,L]' server/public/.htaccess >/dev/null
      - name: Staging origin must remain noindex
        run: |
          grep -F 'invoice-staging\.box4u\.co' server/public/.htaccess >/dev/null
          grep -F 'X-Robots-Tag "noindex, nofollow, noarchive"' server/public/.htaccess >/dev/null

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository secret scan
        run: bash scripts/check-no-secrets.sh
