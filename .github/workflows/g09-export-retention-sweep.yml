name: G09 Staging Export Retention Sweep

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g09-staging-export-retention-sweep
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Delete expired temporary PDFs from Staging
        env:
          STAGING_ORIGIN: ${{ secrets.STAGING_ORIGIN }}
          STAGING_SESSION_PEPPER: ${{ secrets.STAGING_SESSION_PEPPER }}
        run: |
          set -euo pipefail
          token="$(printf '%s' 'g09-export-retention-sweep' | openssl dgst -sha256 -hmac "$STAGING_SESSION_PEPPER" | awk '{print $2}')"
          response="$(curl --fail --silent --show-error \
            -X POST \
            -H "X-Tinv-Cleanup-Token: $token" \
            "${STAGING_ORIGIN%/}/export-retention-sweep.php")"
          printf '%s' "$response" | grep -F '"ok":true' >/dev/null
