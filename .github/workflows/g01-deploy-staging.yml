name: Direct cPanel Staging Deploy

on:
  push:
    branches: ['deploy/staging']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-invoice-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: telegram_invoice_test
          MYSQL_USER: tinv
          MYSQL_PASSWORD: tinv_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      APP_ORIGIN: https://app.example.test
      TELEGRAM_BOT_TOKEN: unit-test-token-not-a-real-secret
      SESSION_PEPPER: unit-test-session-pepper-0123456789abcdef
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: telegram_invoice_test
      DB_USER: tinv
      DB_PASSWORD: tinv_test_password
      AUTH_MAX_AGE_SECONDS: 300
      AUTH_FUTURE_SKEW_SECONDS: 30
      SESSION_IDLE_TTL_SECONDS: 604800
      SESSION_ABSOLUTE_TTL_SECONDS: 2592000
      SESSION_TOUCH_INTERVAL_SECONDS: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Frontend typecheck, tests, build and bundle secret scan
        run: npm run check

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, fileinfo

      - name: Backend syntax and security tests
        run: |
          find server tests/php -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/php/run-unit.php

      - name: DB-backed integration, settings, sales and G09 tests
        run: |
          php server/bin/migrate.php
          php tests/php/run-integration.php
          php tests/php/run-settings.php
          php tests/php/run-sales.php
          php tests/php/run-pilot.php

      - name: Prepare shared-host release without artifact retention
        run: bash scripts/prepare-shared-host-release.sh

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq \
            -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources \
            -o Dir::Etc::sourceparts=-
          sudo apt-get install -y -qq lftp

      - name: Direct deploy, env sync and migration on isolated cPanel staging root
        env:
          STAGING_FTPS_HOST: ${{ secrets.STAGING_FTPS_HOST }}
          STAGING_FTPS_USER: ${{ secrets.STAGING_FTPS_USER }}
          STAGING_FTPS_PASSWORD: ${{ secrets.STAGING_FTPS_PASSWORD }}
          STAGING_ORIGIN: ${{ secrets.STAGING_ORIGIN }}
          STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
          STAGING_SESSION_PEPPER: ${{ secrets.STAGING_SESSION_PEPPER }}
          STAGING_OWNER_TELEGRAM_USER_ID: ${{ secrets.STAGING_OWNER_TELEGRAM_USER_ID }}
          STAGING_DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_DB_HOST: localhost
          STAGING_DB_PORT: 3306
        run: bash scripts/deploy-ftps.sh

      - name: Verify Staging expired-export sweep endpoint
        env:
          STAGING_ORIGIN: ${{ secrets.STAGING_ORIGIN }}
          STAGING_SESSION_PEPPER: ${{ secrets.STAGING_SESSION_PEPPER }}
        run: |
          token="$(printf '%s' 'g09-export-retention-sweep' | openssl dgst -sha256 -hmac "$STAGING_SESSION_PEPPER" | awk '{print $2}')"
          response="$(curl --fail --silent --show-error \
            -X POST \
            -H "X-Tinv-Cleanup-Token: $token" \
            "${STAGING_ORIGIN%/}/export-retention-sweep.php")"
          printf '%s' "$response" | grep -F '"ok":true' >/dev/null

      - name: Install browser for post-deploy smoke
        run: npx playwright install --with-deps chromium

      - name: Post-deploy Playwright smoke on exact staging release
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_ORIGIN }}
        run: npx playwright test tests/e2e/g09-smoke.e2e.spec.ts

      - name: Activate and verify isolated staging bot welcome webhook
        env:
          STAGING_ORIGIN: ${{ secrets.STAGING_ORIGIN }}
          STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
          STAGING_SESSION_PEPPER: ${{ secrets.STAGING_SESSION_PEPPER }}
        run: |
          python3 - <<'PY'
          import hashlib, hmac, json, os, urllib.error, urllib.parse, urllib.request

          origin = os.environ['STAGING_ORIGIN'].rstrip('/')
          token = os.environ['STAGING_TELEGRAM_BOT_TOKEN']
          pepper = os.environ['STAGING_SESSION_PEPPER']
          if origin != 'https://invoice-staging.box4u.co' or not token or not pepper:
              raise SystemExit('Staging bot settings do not match the approved host')
          url = origin + '/bot-webhook.php'
          def bot_api(method, payload=None):
              endpoint = 'https://api.telegram.org/bot' + token + '/' + method
              body = urllib.parse.urlencode(payload or {}).encode()
              try:
                  with urllib.request.urlopen(urllib.request.Request(endpoint, data=body), timeout=30) as response:
                      data = json.load(response)
              except (urllib.error.HTTPError, urllib.error.URLError):
                  raise SystemExit('Telegram ' + method + ' request failed') from None
              if data.get('ok') is not True:
                  raise SystemExit('Telegram ' + method + ' returned an error')
              return data['result']

          current = bot_api('getWebhookInfo').get('url', '')
          if current not in ('', url):
              raise SystemExit('An unrelated staging webhook is already configured; refusing to overwrite it')
          try:
              request = urllib.request.Request(url, data=b'{}', method='POST')
              urllib.request.urlopen(request, timeout=20)
              raise SystemExit('Webhook accepted an unauthenticated request')
          except urllib.error.HTTPError as error:
              if error.code != 403:
                  raise SystemExit('Webhook did not reject unauthenticated requests with 403') from None
          secret = hmac.new(pepper.encode(), b'tinv-welcome-webhook-v1', hashlib.sha256).hexdigest()
          bot_api('setWebhook', {
              'url': url,
              'secret_token': secret,
              'allowed_updates': json.dumps(['message']),
              'drop_pending_updates': 'false',
              'max_connections': '5',
          })
          if bot_api('getWebhookInfo').get('url') != url:
              raise SystemExit('Staging webhook URL was not verified')
          print('Staging bot welcome webhook active on approved host; authenticated webhook configured')
          PY
